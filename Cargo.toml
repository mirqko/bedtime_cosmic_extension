[package]
name = "bedtime-cosmic"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A COSMIC panel applet for scheduling a shutdown timer"

[dependencies]
tokio = { version = "1.52", features = ["time", "process", "rt"] }
libcosmic = { git = "https://github.com/pop-os/libcosmic.git", features = [
    "applet",
    "applet-token",
    "dbus-config",
    "multi-window",
    "tokio",
    "wayland",
    "winit",
] }
